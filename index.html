<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="친구들끼리 다음 여행지와 날짜를 정하는 앱">
<title>Moïse 다음 여행지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">

<style>
:root{
  --paper:#EDEDEB;
  --card:#FFFFFF;
  --card-2:#F3F3F1;
  --ink:#111111;
  --ink-2:#57575A;
  --ink-3:#8C8C8E;
  --line:#D3D3D0;
  --line-2:#E4E4E1;
  --accent:#111111;
  --accent-2:#4A4A4C;
  --accent-soft:#DCDCD9;
  --on-accent:#FFFFFF;
  --on-dark:#FFFFFF;
  --dark:#111111;
  --shadow:0 1px 2px rgba(18,18,17,.06), 0 12px 28px -18px rgba(18,18,17,.5);
  --shadow-lift:0 2px 6px rgba(18,18,17,.08), 0 24px 48px -22px rgba(18,18,17,.55);
  --f-display:"Archivo","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR","Archivo",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111111; --card:#1B1B1B; --card-2:#242424;
    --ink:#F2F2F0; --ink-2:#A9A9A6; --ink-3:#77777A;
    --line:#333333; --line-2:#262626;
    --accent:#F2F2F0; --accent-2:#BDBDBA; --accent-soft:#2E2E2E;
    --on-accent:#111111; --on-dark:#111111; --dark:#F2F2F0;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 28px -18px rgba(0,0,0,.9);
    --shadow-lift:0 2px 6px rgba(0,0,0,.55), 0 24px 48px -22px rgba(0,0,0,.95);
  }
}
:root[data-theme="dark"]{
  --paper:#111111; --card:#1B1B1B; --card-2:#242424;
  --ink:#F2F2F0; --ink-2:#A9A9A6; --ink-3:#77777A;
  --line:#333333; --line-2:#262626;
  --accent:#F2F2F0; --accent-2:#BDBDBA; --accent-soft:#2E2E2E;
  --on-accent:#111111; --on-dark:#111111; --dark:#F2F2F0;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 28px -18px rgba(0,0,0,.9);
  --shadow-lift:0 2px 6px rgba(0,0,0,.55), 0 24px 48px -22px rgba(0,0,0,.95);
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--f-body);font-size:16px;line-height:1.6;
  -webkit-text-size-adjust:100%;overflow-x:hidden;
}
button,input,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent-2);outline-offset:2px;border-radius:4px}

.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
  padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--paper);
  border-bottom:2px solid var(--ink);padding:10px 16px 0}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--f-display);font-weight:900;font-size:17px;letter-spacing:-.03em;line-height:1.1}
.brand em{font-style:normal;color:var(--accent)}
.who{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);white-space:nowrap;
  border:1.5px solid var(--line);border-radius:999px;padding:3px 9px}
.steps{display:flex;gap:0;margin:9px 0 0;list-style:none;padding:0}
.steps li{flex:1;font-family:var(--f-mono);font-size:9px;letter-spacing:.02em;color:var(--ink-3);
  text-align:center;padding:5px 2px 7px;border-bottom:3px solid transparent;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps li.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.steps li.past{color:var(--ink-2)}

/* ---------- generic ---------- */
main{padding:20px 16px 0;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
h1.title{font-family:var(--f-display);font-weight:900;font-size:34px;line-height:1.02;
  margin:6px 0 0;letter-spacing:-.045em;text-wrap:balance}
h2.sub{font-family:var(--f-display);font-weight:800;font-size:19px;margin:0;letter-spacing:-.03em}
p.lede{margin:0;color:var(--ink-2);font-size:14.5px}
.muted{color:var(--ink-3);font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-sm{display:flex;flex-direction:column;gap:8px}

.panel{background:var(--card);border:2px solid var(--ink);border-radius:4px;padding:16px}
.panel.soft{border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.notice{display:flex;gap:9px;align-items:flex-start;background:var(--accent-soft);
  border:2px solid var(--ink);border-radius:4px;padding:10px 12px;font-size:13.5px;
  line-height:1.5;color:var(--ink)}
.notice .ic{font-family:var(--f-mono);font-weight:700;flex:none}
.banner{font-size:12.5px;color:var(--ink-2);background:var(--card-2);
  border:1px dashed var(--line);border-radius:10px;padding:8px 11px;display:flex;gap:8px;align-items:center}
.banner .mk{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.06em;color:var(--ink-3);
  flex:none;text-transform:uppercase}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;
  padding:0 18px;border-radius:999px;border:2px solid var(--ink);background:var(--card);
  color:var(--ink);font-weight:700;font-size:15px;transition:transform .1s ease}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--dark);border-color:var(--dark);color:var(--on-dark)}
.btn.red{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.sm{min-height:40px;font-size:13.5px;padding:0 14px;font-weight:600;border-width:1.5px}
.btn.block{width:100%}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

.field{width:100%;background:var(--card);border:2px solid var(--ink);border-radius:4px;
  padding:13px 14px;min-height:50px}
.field::placeholder{color:var(--ink-3)}
.field:focus{outline:none;border-color:var(--accent)}
textarea.field{resize:vertical;line-height:1.6;min-height:92px}

/* ---------- boarding pass ---------- */
.pass{position:relative;display:flex;flex-direction:column;border:2px solid var(--ink);
  border-radius:6px;overflow:hidden;background:var(--card)}
.pass-top{background:var(--accent);color:var(--on-accent);padding:14px 16px 12px}
.pass.b .pass-top{background:var(--accent-2);color:var(--on-accent)}
.pass.k .pass-top{background:var(--dark);color:var(--on-dark)}
.pass-code{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;opacity:.85}
.pass-name{font-family:var(--f-display);font-weight:900;font-size:30px;line-height:1;
  letter-spacing:-.045em;margin-top:5px;overflow-wrap:anywhere}
.pass-city{font-size:13px;opacity:.9;margin-top:4px}
.pass-perf{height:0;border-top:2px dashed var(--ink);position:relative}
.pass-perf::before,.pass-perf::after{content:"";position:absolute;top:-9px;width:16px;height:16px;
  border-radius:50%;background:var(--paper);border:2px solid var(--ink)}
.pass-perf::before{left:-10px}
.pass-perf::after{right:-10px}
.pass-body{padding:13px 16px;display:grid;grid-template-columns:1fr 1fr;gap:11px}
.cell .k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase}
.cell .v{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.02em;margin-top:1px}
.cell .v small{font-weight:600;font-size:12px;color:var(--ink-2)}

.pick-wrap{position:relative}
.tapcard{width:100%;text-align:left;padding:0;background:none;border:0;display:block;font:inherit;color:inherit}
.pass.sel{box-shadow:0 0 0 4px var(--ink)}
.tick{position:absolute;top:10px;right:12px;width:28px;height:28px;border-radius:50%;
  background:var(--card);border:2px solid var(--ink);display:grid;place-items:center;
  font-weight:900;font-size:14px;color:transparent;z-index:2}
.pass.sel .tick{background:var(--ink);color:var(--card)}

/* ---------- map ---------- */
.mapwrap{background:var(--card);border:2px solid var(--ink);border-radius:6px;
  padding:10px;overflow:hidden}
.mapwrap svg{width:100%;height:auto;display:block}
.land{fill:var(--card-2);stroke:var(--line);stroke-width:.3}
.land.on{fill:var(--accent);stroke:var(--accent-2);stroke-width:.4}
.route{fill:none;stroke:var(--ink);stroke-width:.7;stroke-dasharray:2.5 2;opacity:.55}
.dot{fill:var(--accent);stroke:var(--card);stroke-width:.8}
.dot.home{fill:var(--accent-2)}

/* ---------- calendar ---------- */
.cal{border:2px solid var(--ink);border-radius:6px;background:var(--card);overflow:hidden}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);background:var(--dark);
  color:var(--on-dark);position:sticky;top:0;z-index:2}
.cal-head span{font-family:var(--f-mono);font-size:10px;text-align:center;padding:7px 0;font-weight:600}
.cal-head span.we{color:var(--accent)}
.cal-scroll{max-height:min(58vh,460px);overflow-y:auto;overscroll-behavior:contain}
.cal-month{border-top:1px solid var(--line-2)}
.cal-month:first-child{border-top:0}
.cal-label{font-family:var(--f-display);font-weight:900;font-size:15px;letter-spacing:-.03em;
  padding:10px 12px 6px;position:sticky;top:0;background:var(--card);z-index:1;
  border-bottom:1px solid var(--line-2)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-day{aspect-ratio:1;display:grid;place-items:center;font-size:13.5px;font-weight:500;
  border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);
  background:var(--card);user-select:none;-webkit-user-select:none;color:var(--ink-2)}
.cal-day:nth-child(7n){border-right:0}
.cal-day.pad{background:var(--card-2)}
.cal-day.on{background:var(--accent);color:var(--on-accent);font-weight:800}
.cal-day.pre{background:var(--accent-soft);color:var(--ink);font-weight:800}
.cal-picked{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);
  padding:2px 2px 0;overflow-wrap:anywhere}

/* ---------- heatmap ---------- */
.heat-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.heat-cell{aspect-ratio:1;border-radius:3px;display:grid;place-items:center;
  font-size:10px;font-family:var(--f-mono);color:var(--ink-3);background:var(--card-2)}
.heat-cell.h1{background:color-mix(in srgb,var(--accent) 22%,var(--card));color:var(--ink-2)}
.heat-cell.h2{background:color-mix(in srgb,var(--accent) 48%,var(--card));color:var(--ink)}
.heat-cell.h3{background:color-mix(in srgb,var(--accent) 74%,var(--card));color:var(--on-accent)}
.heat-cell.h4{background:var(--accent);color:var(--on-accent);font-weight:700}
.best{display:flex;flex-wrap:wrap;gap:6px}
.best b{font-family:var(--f-mono);font-size:12.5px;background:var(--dark);color:var(--on-dark);
  border-radius:999px;padding:4px 11px;font-weight:600}

/* ---------- search ---------- */
.results{border:2px solid var(--ink);border-top:0;border-radius:0 0 6px 6px;
  max-height:270px;overflow-y:auto;background:var(--card)}
.res{width:100%;display:flex;align-items:center;gap:10px;padding:11px 13px;background:none;
  border:0;border-top:1px solid var(--line-2);text-align:left;font:inherit;color:inherit}
.res:first-child{border-top:0}
.res .nm{font-weight:700;flex:1;min-width:0}
.res .rg{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
.res .hr{font-family:var(--f-mono);font-size:11px;color:var(--ink-2)}

/* ---------- tags ---------- */
.tagrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag-chip{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:4px 10px;
  border-radius:999px;background:var(--accent-soft);color:var(--ink);border:1.5px solid var(--line)}
.tag-chip.on{background:var(--dark);color:var(--on-dark);border-color:var(--dark)}
.tag-chip button{background:none;border:0;color:inherit;font:inherit;padding:0 0 0 5px;opacity:.7}
.tag-sug{font-family:var(--f-mono);font-size:12px;padding:5px 10px;border-radius:999px;
  background:var(--card);color:var(--ink-2);border:1.5px dashed var(--line)}
.tag-edit{border:2px solid var(--ink);border-top:0;border-radius:0 0 6px 6px;background:var(--card);
  padding:13px;display:flex;flex-direction:column;gap:9px}

/* ---------- results / rank ---------- */
.rrow{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center}
.rpos{font-family:var(--f-display);font-size:17px;font-weight:900;color:var(--ink-3);text-align:right}
.rrow.lead .rpos{color:var(--accent)}
.rname{font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:-.02em;overflow-wrap:anywhere}
.rnum{font-family:var(--f-mono);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.bar{grid-column:1/4;height:9px;background:var(--line-2);overflow:hidden;margin-top:-3px;border-radius:2px}
.bar span{display:block;height:100%;background:var(--ink)}
.rrow.lead + .bar span{background:var(--accent)}

.cmt{background:var(--card-2);border-left:4px solid var(--accent);padding:10px 12px;
  font-size:14px;line-height:1.6;color:var(--ink-2);overflow-wrap:anywhere;border-radius:0 4px 4px 0}
.cmt .anon{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;color:var(--ink-3);
  display:block;margin-bottom:3px;text-transform:uppercase}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:4px 11px;border-radius:999px;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.chip.done{background:var(--dark);border-color:var(--dark);color:var(--on-dark)}
.chip .mk{font-family:var(--f-mono);font-size:10px}

/* ---------- wheel ---------- */
.wheelwrap{position:relative;width:min(86vw,330px);margin:4px auto 0;aspect-ratio:1}
.wheelwrap svg{width:100%;height:100%;overflow:visible}
#wheelspin{transform-origin:100px 100px}
.needle{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;
  border-left:12px solid transparent;border-right:12px solid transparent;
  border-top:22px solid var(--ink);z-index:2}
.hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:52px;height:52px;
  border-radius:50%;background:var(--card);border:2px solid var(--ink);display:grid;
  place-items:center;font-family:var(--f-mono);font-size:10px;font-weight:600;z-index:2}

.big-result{text-align:center;padding:6px 0 0}
.big-result .kicker{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;
  color:var(--accent);text-transform:uppercase}
.big-result .name{font-family:var(--f-display);font-weight:900;font-size:42px;line-height:1;
  margin:8px 0 6px;letter-spacing:-.05em;text-wrap:balance;overflow-wrap:anywhere}

/* ---------- dock / sheet ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);
  border-top:2px solid var(--ink);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.dock .hint{font-size:12px;color:var(--ink-3);text-align:center}
.foot{padding:20px 16px 6px;text-align:center}
.foot button{background:none;border:0;color:var(--ink-3);font-size:12px;
  text-decoration:underline;text-underline-offset:3px;padding:6px}

.scrim{position:fixed;inset:0;z-index:60;background:rgba(10,10,9,.6);
  display:flex;align-items:flex-end;justify-content:center;animation:fade .16s ease}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:520px;background:var(--paper);border-radius:14px 14px 0 0;
  border-top:2px solid var(--ink);padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));
  max-height:90vh;overflow-y:auto;animation:up .22s cubic-bezier(.2,.9,.25,1);box-shadow:var(--shadow-lift)}
@keyframes up{from{transform:translateY(20px)}}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 12px}
.pill-toggle{display:flex;gap:8px}
.pill-toggle .btn{flex:1;flex-direction:column;gap:2px;min-height:auto;padding:15px 10px;
  text-align:center;border-radius:6px}
.pill-toggle .btn .k{font-family:var(--f-display);font-size:17px;font-weight:900;letter-spacing:-.03em}
.pill-toggle .btn .d{font-size:11.5px;font-weight:400;color:var(--ink-3);line-height:1.4}

.counter{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);text-align:right;margin-top:-4px}
.counter.over{color:var(--accent);font-weight:700}
.aibox{background:var(--card-2);border:1.5px solid var(--line);border-radius:4px;padding:12px 13px;
  font-size:14.5px;line-height:1.65;overflow-wrap:anywhere;min-height:44px}
.aibox.err{background:var(--accent-soft);color:var(--ink);border-color:var(--ink);font-size:13.5px}
.compose{border:2px solid var(--ink);border-top:0;background:var(--card);padding:14px;
  display:flex;flex-direction:column;gap:10px;border-radius:0 0 6px 6px}
.compose-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tag{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 8px;border-radius:999px;border:1.5px solid var(--line);color:var(--ink-3)}
.tag.ok{color:var(--on-dark);background:var(--dark);border-color:var(--dark)}
.tag.warn{color:var(--ink);background:var(--accent-soft);border-color:var(--ink)}
.codebox{font-family:var(--f-mono);font-size:32px;font-weight:600;letter-spacing:.22em;
  text-align:center;padding:14px 4px 14px 22px;background:var(--dark);color:var(--on-dark);border-radius:4px}
input.uppercase{text-transform:uppercase;letter-spacing:.2em;font-family:var(--f-mono);text-align:center}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="brand">Moïse <em>다음 여행지</em></div>
      <div class="who" id="who"></div>
    </div>
    <ul class="steps" id="steps"></ul>
  </header>
  <main id="main"></main>
  <div class="foot" id="foot"></div>
</div>
<div id="dock"></div>
<div id="modal"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="data/world.js"></script>
<script src="data/places.js"></script>
<script src="lib.js"></script>
<script src="app.js"></script>
</body>
</html>
