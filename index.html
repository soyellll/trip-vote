<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="친구들끼리 여행지를 익명 투표로 정하는 앱">
<title>여행지 소거전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --paper:#EBEFEE;
  --card:#FFFFFF;
  --card-2:#F4F7F6;
  --ink:#141B1A;
  --ink-2:#4C5856;
  --ink-3:#7E8B89;
  --line:#D4DBD9;
  --line-2:#E5EAE9;
  --teal:#12665C;
  --teal-deep:#0C4A43;
  --teal-soft:#DCEBE7;
  --gold:#B36F16;
  --gold-soft:#F6E8D3;
  --danger:#A93A2C;
  --danger-soft:#F6DFDB;
  --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(20,27,26,.05), 0 10px 26px -16px rgba(20,27,26,.35);
  --shadow-lift:0 2px 4px rgba(20,27,26,.06), 0 18px 40px -18px rgba(20,27,26,.42);
  --f-display:"Hahmlet","Nanum Myeongjo",Georgia,serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1312;
    --card:#161F1D;
    --card-2:#1E2A28;
    --ink:#E9F0ED;
    --ink-2:#A8B6B3;
    --ink-3:#778582;
    --line:#2C3936;
    --line-2:#232F2D;
    --teal:#55C9B3;
    --teal-deep:#8FE0CF;
    --teal-soft:#12332F;
    --gold:rgb(226,169,79);
    --gold-soft:#332711;
    --danger:rgb(230,127,111);
    --danger-soft:#3A211D;
    --on-accent:#08211E;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.8);
    --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 18px 40px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --paper:#0D1312;
  --card:#161F1D;
  --card-2:#1E2A28;
  --ink:#E9F0ED;
  --ink-2:#A8B6B3;
  --ink-3:#778582;
  --line:#2C3936;
  --line-2:#232F2D;
  --teal:#55C9B3;
  --teal-deep:#8FE0CF;
  --teal-soft:#12332F;
  --gold:rgb(226,169,79);
  --gold-soft:#332711;
  --danger:rgb(230,127,111);
  --danger-soft:#3A211D;
  --on-accent:#08211E;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.8);
  --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 18px 40px -18px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:16px;
  line-height:1.6;
  -webkit-text-size-adjust:100%;
  overflow-x:hidden;
}
button,input,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}

.app{
  max-width:520px;margin:0 auto;min-height:100vh;
  display:flex;flex-direction:column;
  padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));
}

/* ---------- header ---------- */
.top{
  position:sticky;top:0;z-index:30;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line-2);
  padding:10px 16px 8px;
}
.top-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand .dot{color:var(--gold)}
.who{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);white-space:nowrap}
.steps{display:flex;gap:4px;margin-top:8px;list-style:none;padding:0}
.steps li{
  flex:1;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.04em;
  color:var(--ink-3);text-align:center;padding-top:6px;
  border-top:2px solid var(--line);text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.steps li.on{color:var(--teal);border-top-color:var(--teal);font-weight:600}
.steps li.past{color:var(--ink-2);border-top-color:var(--teal-soft)}

/* ---------- generic ---------- */
main{padding:18px 16px 0;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
h1.title{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.3;margin:4px 0 0;text-wrap:balance;letter-spacing:-.02em}
h2.sub{font-family:var(--f-display);font-weight:500;font-size:18px;margin:0;letter-spacing:-.01em}
p.lede{margin:0;color:var(--ink-2);font-size:14.5px}
.muted{color:var(--ink-3);font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
hr.rule{border:0;border-top:1px dashed var(--line);margin:2px 0}

.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.notice{
  display:flex;gap:10px;align-items:flex-start;
  background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 35%, transparent);
  border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.55;color:var(--ink-2);
}
.notice b{color:var(--ink)}
.notice .ic{font-family:var(--f-mono);color:var(--gold);font-weight:600;flex:none}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-weight:600;font-size:15px;
  transition:transform .12s ease, background .15s ease, border-color .15s ease;
}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--on-accent)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;font-size:13.5px;padding:0 12px;border-radius:10px;font-weight:500}
.btn.block{width:100%}
.btn[disabled]{opacity:.42;pointer-events:none}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

.field{
  width:100%;background:var(--card-2);border:1px solid var(--line);
  border-radius:12px;padding:13px 14px;min-height:48px;
}
.field::placeholder{color:var(--ink-3)}
.field:focus{outline:none;border-color:var(--teal);background:var(--card)}
textarea.field{resize:vertical;line-height:1.6;min-height:88px}

/* ---------- ticket ---------- */
.ticket{
  position:relative;display:grid;grid-template-columns:46px 1fr;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);transition:border-color .15s ease, box-shadow .15s ease;
}
.ticket::before,.ticket::after{
  content:"";position:absolute;left:39px;width:14px;height:14px;
  border-radius:50%;background:var(--paper);
}
.ticket::before{top:-7px}
.ticket::after{bottom:-7px}
.ticket .stub{
  border-right:1px dashed var(--line);display:flex;align-items:center;justify-content:center;
  padding:14px 0;
}
.ticket .code{
  font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--ink-3);
  writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.16em;
}
.ticket .tbody{padding:13px 14px 13px 13px;min-width:0}
.ticket .tname{font-family:var(--f-display);font-weight:700;font-size:17.5px;line-height:1.35;letter-spacing:-.01em;overflow-wrap:anywhere}
.ticket .tnote{color:var(--ink-2);font-size:13.5px;margin-top:3px;overflow-wrap:anywhere}
.ticket .tby{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);margin-top:7px;letter-spacing:.05em}

.ticket.pick{border-color:var(--teal);box-shadow:0 0 0 2px color-mix(in srgb,var(--teal) 26%,transparent), var(--shadow)}
.ticket.pick .stub{background:var(--teal-soft);border-right-color:color-mix(in srgb,var(--teal) 40%,transparent)}
.ticket.pick .code{color:var(--teal)}
.ticket.win{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 30%,transparent), var(--shadow-lift)}
.ticket.win .stub{background:var(--gold-soft)}
.ticket.win .code{color:var(--gold)}
.ticket.out{opacity:.5}

.tapcard{width:100%;text-align:left;padding:0;background:none;border:0;display:block;font:inherit;color:inherit}
.tapcard:active .ticket{transform:scale(.99)}

.checkbox{
  flex:none;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);
  display:grid;place-items:center;font-size:13px;color:transparent;background:var(--card-2);
  font-family:var(--f-mono);font-weight:600;
}
.ticket.pick .checkbox{background:var(--teal);border-color:var(--teal);color:var(--on-accent)}

/* ---------- comment composer ---------- */
.compose{
  margin:0 0 0 46px;border:1px solid var(--teal);border-top:0;
  border-radius:0 0 14px 14px;background:var(--card);
  padding:14px;display:flex;flex-direction:column;gap:10px;
  box-shadow:var(--shadow);
}
.compose-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tag{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink-3);
}
.tag.ok{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 45%,transparent);background:var(--teal-soft)}
.tag.warn{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,transparent);background:var(--gold-soft)}

.aibox{
  background:var(--teal-soft);border:1px solid color-mix(in srgb,var(--teal) 30%,transparent);
  border-radius:11px;padding:12px 13px;font-size:14.5px;line-height:1.65;color:var(--ink);
  overflow-wrap:anywhere;min-height:44px;
}
.aibox.err{background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 40%,transparent);color:var(--ink-2);font-size:13.5px}
.caret{display:inline-block;width:7px;height:16px;background:var(--teal);vertical-align:-3px;animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}

/* ---------- results ---------- */
.rank{display:flex;flex-direction:column;gap:10px}
.rrow{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center}
.rpos{font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--ink-3);text-align:right}
.rrow.lead .rpos{color:var(--gold)}
.rname{font-family:var(--f-display);font-weight:500;font-size:15.5px;overflow-wrap:anywhere}
.rrow.lead .rname{font-weight:700}
.rnum{font-family:var(--f-mono);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.bar{grid-column:2/4;height:7px;border-radius:99px;background:var(--line-2);overflow:hidden;margin-top:-4px}
.bar span{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .5s ease}
.rrow.lead + .bar span{background:var(--gold)}

.cmt{
  background:var(--card-2);border:1px solid var(--line-2);border-left:3px solid var(--teal);
  border-radius:0 11px 11px 0;padding:10px 12px;font-size:14px;line-height:1.6;color:var(--ink-2);
  overflow-wrap:anywhere;
}
.cmt .anon{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:var(--ink-3);display:block;margin-bottom:3px;text-transform:uppercase}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font-size:12.5px;padding:4px 10px;border-radius:999px;
  border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  display:inline-flex;align-items:center;gap:5px;
}
.chip.done{background:var(--teal-soft);border-color:color-mix(in srgb,var(--teal) 35%,transparent);color:var(--teal-deep)}
.chip .mk{font-family:var(--f-mono);font-size:10px}

/* ---------- wheel ---------- */
.wheelwrap{position:relative;width:min(88vw,340px);margin:6px auto 0;aspect-ratio:1}
.wheelwrap svg{width:100%;height:100%;overflow:visible}
#wheelspin{transform-origin:100px 100px}
.needle{
  position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;
  border-top:20px solid var(--gold);filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));z-index:2;
}
.hub{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:46px;height:46px;border-radius:50%;background:var(--card);border:2px solid var(--line);
  display:grid;place-items:center;font-family:var(--f-mono);font-size:10px;color:var(--ink-3);z-index:2;
}

/* ---------- bottom bar ---------- */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:color-mix(in srgb,var(--paper) 92%, transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line-2);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
}
.dock-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:7px}
.dock .hint{font-size:12px;color:var(--ink-3);text-align:center}

/* ---------- sheet ---------- */
.scrim{
  position:fixed;inset:0;z-index:60;background:rgba(10,16,15,.55);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fade .18s ease;
}
@keyframes fade{from{opacity:0}}
.sheet{
  width:100%;max-width:520px;background:var(--paper);
  border-radius:20px 20px 0 0;border-top:1px solid var(--line);
  padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));
  max-height:88vh;overflow-y:auto;animation:up .24s cubic-bezier(.2,.9,.25,1);
  box-shadow:var(--shadow-lift);
}
@keyframes up{from{transform:translateY(22px)}}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 12px}

.pill-toggle{display:flex;gap:8px}
.pill-toggle .btn{flex:1;flex-direction:column;gap:2px;min-height:auto;padding:14px 10px;text-align:center}
.pill-toggle .btn .k{font-family:var(--f-display);font-size:16px;font-weight:700}
.pill-toggle .btn .d{font-size:11.5px;font-weight:400;color:var(--ink-3);line-height:1.4}

.banner{
  font-size:12.5px;color:var(--ink-2);background:var(--card-2);border:1px dashed var(--line);
  border-radius:10px;padding:8px 11px;display:flex;gap:8px;align-items:center;
}
.banner .mk{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;color:var(--ink-3);flex:none;text-transform:uppercase}

.big-result{text-align:center;padding:8px 0 2px}
.big-result .kicker{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
.big-result .name{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.2;margin:8px 0 4px;letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}

.linkline{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.foot{padding:22px 16px 8px;text-align:center}
.foot button{background:none;border:0;color:var(--ink-3);font-size:12px;text-decoration:underline;text-underline-offset:3px;padding:6px}

.codebox{
  font-family:var(--f-mono);font-size:30px;font-weight:600;letter-spacing:.24em;
  text-align:center;padding:16px 8px 16px 20px;color:var(--teal);
  background:var(--card-2);border:1px dashed var(--line);border-radius:12px;
}
.counter{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);text-align:right;margin-top:-4px}
.counter.over{color:var(--danger);font-weight:600}
input.uppercase{text-transform:uppercase;letter-spacing:.2em;font-family:var(--f-mono);text-align:center}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style></head>
<body>

<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="brand">여행지 소거전<span class="dot">.</span></div>
      <div class="who" id="who"></div>
    </div>
    <ul class="steps" id="steps"></ul>
  </header>
  <main id="main"></main>
  <div class="foot" id="foot"></div>
</div>
<div id="dock"></div>
<div id="modal"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
